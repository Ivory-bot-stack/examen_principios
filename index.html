const cg=new THREE.BufferGeometry();cg.setAttribute('position',new THREE.Float32BufferAttribute(cp.map((v,i)=>v),3));
// fix: cp holds x,y,z triples
const cp3=[];for(let r=1;r<5;r++)for(let s=0;s<NS;s++){const s2=(s+1)%NS,add3=(a,b)=>cp3.push(a[0],a[1],1.56,b[0],b[1],1.56);add3(V[r-1][s],V[r][s]);if(r<4)add3(V[r][s],V[r][s2])}
cg.setAttribute('position',new THREE.Float32BufferAttribute(cp3,3));
const cmat=new THREE.LineBasicMaterial({color:0xdfe6ff,transparent:true}),cracks=new THREE.LineSegments(cg,cmat);rig.add(cracks);
const nseg=cp3.length/6;
// particles
const pp=[];for(let i=0;i<500;i++){const r=3+rnd()*12,a=rnd()*6.28,b=Math.acos(2*rnd()-1);pp.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a))}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.Float32BufferAttribute(pp,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x9a7cff,size:.035,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false}));sc.add(pts);
// state driven by the master timeline
const S={yaw:-1.1,z:7,x:0,y:0,lx:0,lz:0,roll:0,crack:0,frac:0,body:1,sh:1,reform:0,hue:0,emerge:0};
function frame(tm){const t=tm/1000,bo=S.body*S.emerge;
mats.forEach(([m,b])=>m.opacity=b*bo);body.visible=bo>.01;
rig.rotation.set(.06,S.yaw,0);rig.position.y=-.4;
const e=S.frac*(1-S.reform);
shards.forEach(o=>{o.m.position.set(o.c[0]+o.d[0]*e+Math.sin(t*.6+o.ph)*.1*e,o.c[1]+o.d[1]*e+Math.cos(t*.5+o.ph)*.1*e,1.55+o.d[2]*e);
o.m.rotation.set(o.r[0]*e,o.r[1]*e,o.r[2]*e);o.mt.opacity=.5*S.sh*Math.min(1,S.emerge*2)});
cg.setDrawRange(0,Math.floor(S.crack*nseg)*2);cmat.opacity=Math.max(0,1-S.frac*4)*S.emerge;
blu.position.x=3*Math.cos(S.hue*Math.PI);rim.intensity=3+3*S.hue;key.intensity=2.2*S.emerge;
pts.rotation.y=t*.02+S.z*.1;
cam.position.set(S.x,S.y,S.z);cam.lookAt(S.lx,-.4,S.lz);cam.rotateZ(S.roll);
R.render(sc,cam)}
function rs(){const dpr=Math.min(devicePixelRatio||1,H.classList.contains('pres')?1.25:2);R.setPixelRatio(dpr);R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();gsap.ticker.add((a,b)=>frame(performance.now()));
// intro on load: title letters + camera emerging from darkness
const ttl=document.getElementById('ttl');ttl.innerHTML=[...ttl.textContent].map(c=>`<span>${c}</span>`).join('');
gsap.from('#ttl span',{y:50,opacity:0,filter:'blur(12px)',duration:1.4,stagger:.1,ease:'power3.out',delay:.3});
gsap.to(S,{emerge:1,duration:3.2,delay:.8,ease:'power2.out'});
// master timeline scrubbed by scroll
const T0=6.6,TOTAL=T0+17*3+.4,navT=[.2];
const tl=gsap.timeline({defaults:{ease:'none'},scrollTrigger:{trigger:'#track',start:'top top',end:'bottom bottom',scrub:1,onUpdate:self=>{const t=self.progress*TOTAL;let i=0;navT.forEach((n,j)=>{if(n-1.4<=t)i=j});ct.textContent=(i+1)+' / 18';document.getElementById('hint').style.opacity=t<.4?1:0}}});
tl.set({},{},TOTAL);
tl.to(S,{yaw:0,z:5.6,duration:2,ease:'power1.inOut'},0)
.to('#hero',{opacity:0,y:-40,duration:1.4},.5)
.to(S,{z:2.1,lz:1.55,y:-.4,duration:2.2,ease:'power2.inOut'},2)
.to(S,{crack:1,duration:.8},4.1)
.to('#flash',{opacity:.85,duration:.15},4.85).to('#flash',{opacity:0,duration:.6},5)
.to(S,{frac:1,duration:1.2,ease:'power3.out'},4.9)
.to(S,{body:0,duration:1},5)
.to(S,{z:4.5,lz:.8,duration:1.2,ease:'power2.inOut'},5.9)
.to(S,{sh:.45,duration:.8},6.2);
const VR=[{x:90,rotationY:-14},{y:70,rotationX:10},{scale:.86},{x:-90,rotationY:14},{y:-60,scale:1.06}];
for(let k=2;k<=18;k++){const ti=T0+(k-2)*3,el='#s'+k,calm=k>=15&&k<=17;
tl.fromTo(el,{autoAlpha:0,...(calm?{y:14}:VR[k%5])},{autoAlpha:1,x:0,y:0,scale:1,rotationX:0,rotationY:0,duration:.7,ease:'power2.out'},ti);
navT.push(ti+1.5);
if(k<18){tl.to(el,{autoAlpha:0,y:-24,scale:.98,duration:.6},ti+2.4);
const a=Math.sin(k*1.9)*(calm?.25:.7);
tl.to(S,{x:a,y:-.4+Math.cos(k*1.3)*(calm?.08:.25),lx:-a*.4,roll:Math.sin(k*2.3)*(calm?.01:.04),hue:k%2,duration:1.4,ease:'power1.inOut'},ti-.2)}
else tl.to(S,{reform:1,z:3.3,x:0,y:-.4,lx:0,lz:1.55,roll:0,hue:0,duration:2,ease:'power2.inOut'},ti+.2).to(S,{sh:1,body:.55,duration:2},ti+.2)}
// navigation
const ct=document.getElementById('ct');let cur=0;
const idx=()=>{const t=scrollY/(H.scrollHeight-innerHeight)*TOTAL;let i=0;navT.forEach((n,j)=>{if(n-1.4<=t)i=j});return i};
const go=i=>{i=Math.max(0,Math.min(17,i));scrollTo({top:navT[i]/TOTAL*(H.scrollHeight-innerHeight),behavior:'smooth'})};
document.getElementById('pv').onclick=()=>go(idx()-1);document.getElementById('nx').onclick=()=>go(idx()+1);
const pm=document.getElementById('pm');pm.onclick=()=>{const on=H.classList.toggle('pres');pm.setAttribute('aria-pressed',on);rs();ScrollTrigger.refresh()};
addEventListener('keydown',e=>{const k=e.key;if(['ArrowRight','ArrowDown','PageDown',' '].includes(k)){e.preventDefault();go(idx()+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(k)){e.preventDefault();go(idx()-1)}else if(k==='p'||k==='P')pm.click();else if(k==='Home')go(0)});
}catch(err){document.documentElement.classList.remove('cine');console.warn('Modo estático: efectos 3D no disponibles',err)}})();
</script></body></html>
